<svg viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f1f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5c4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c9a86b;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="characterGown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark academia background -->
  <rect width="1200" height="450" fill="url(#darkBg)"/>
  
  <!-- Gothic architecture silhouettes (distant towers) -->
  <polygon points="0,250 80,100 160,250" fill="#2a1a3e" opacity="0.15"/>
  <polygon points="1100,280 1150,120 1200,280" fill="#2a1a3e" opacity="0.15"/>
  <rect x="30" y="200" width="20" height="250" fill="#1a0a1e" opacity="0.1"/>
  <rect x="1150" y="200" width="20" height="250" fill="#1a0a1e" opacity="0.1"/>
  
  <!-- Animated twinkling stars -->
  <circle cx="100" cy="50" r="1.5" fill="#c9a86b" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="60" r="1" fill="#e8d5c4" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="40" r="1.2" fill="#b8a8b8" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="80" r="0.8" fill="#c9a86b" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animated floating particles -->
  <circle cx="150" cy="80" r="0.6" fill="#7a5a7f" opacity="0.3">
    <animate attributeName="cy" values="80;300;80" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="150" r="0.8" fill="#c9a86b" opacity="0.2">
    <animate attributeName="cy" values="150;350;150" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite" />
  </circle>
  
  <!-- Subtle spiderweb (left) -->
  <path d="M 50 80 L 120 150 M 50 80 L 150 120 M 50 80 L 130 200" stroke="#4a3a52" stroke-width="0.6" fill="none" opacity="0.25"/>
  <path d="M 80 100 Q 110 130 140 150" stroke="#4a3a52" stroke-width="0.5" fill="none" opacity="0.2"/>
  
  <!-- Animated raven (top right, circling) -->
  <g id="raven">
    <g transform="translate(1050, 80)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="16" ry="18" fill="#0a0a0a" opacity="0.85"/>
      <!-- Head -->
      <circle cx="0" cy="-16" r="12" fill="#000000"/>
      <!-- Eye -->
      <circle cx="5" cy="-18" r="2.5" fill="#c9a86b" opacity="0.9"/>
      <circle cx="6" cy="-19" r="1" fill="#000000"/>
      <!-- Beak -->
      <path d="M 10 -16 L 18 -15 L 10 -13 Z" fill="#3a3a3a"/>
      <!-- Wings (flapping) -->
      <path d="M -6 -4 Q -22 -12 -26 -2" fill="#000000" opacity="0.8">
        <animate attributeName="d" values="M -6 -4 Q -22 -12 -26 -2; M -6 -4 Q -24 -16 -28 -4; M -6 -4 Q -22 -12 -26 -2" dur="1.8s" repeatCount="indefinite" />
      </path>
      <!-- Tail -->
      <path d="M 8 12 L 12 28" stroke="#000000" stroke-width="2.5" fill="none" opacity="0.8"/>
      <!-- Flying animation -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="1050,80; 1080,50; 1100,100; 1050,80"
        dur="5s"
        repeatCount="indefinite"
      />
    </g>
  </g>
  
  <!-- Animated moon (upper right) -->
  <g id="moon">
    <circle cx="1000" cy="100" r="45" fill="url(#moonGlow)" opacity="0.5"/>
    <circle cx="1000" cy="100" r="45" fill="none" stroke="#8b6f47" stroke-width="1.5" opacity="0.6"/>
    <!-- Crescent shadow -->
    <circle cx="1020" cy="95" r="43" fill="#0a0a0a" opacity="0.75"/>
    <!-- Pulsing glow -->
    <circle cx="1000" cy="100" r="45" fill="none" stroke="#c9a86b" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="r" values="45;62;45" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Wednesday Character (left side, main focus) -->
  <g id="wednesday-character">
    <g transform="translate(110, 200)">
      <!-- Dress/Gown -->
      <path d="M -18 -28 L -28 5 L -24 95 L 24 95 L 28 5 L 18 -28 Z" fill="url(#characterGown)" opacity="0.95"/>
      <!-- Collar detail -->
      <path d="M -12 -25 Q 0 -20 12 -25" stroke="#e8d5c4" stroke-width="1" fill="none" opacity="0.7"/>
      
      <!-- Left arm (animated) -->
      <line x1="-18" y1="-8" x2="-42" y2="15" stroke="#2a2a3e" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <animate attributeName="x2" values="-42;-48;-42" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="15;8;15" dur="3s" repeatCount="indefinite" />
      </line>
      <!-- Right arm (animated) -->
      <line x1="18" y1="-8" x2="42" y2="15" stroke="#2a2a3e" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <animate attributeName="x2" values="42;48;42" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="15;8;15" dur="3s" repeatCount="indefinite" />
      </line>
      
      <!-- Neck -->
      <rect x="-10" y="-32" width="20" height="10" fill="#e0cfc4" opacity="0.9"/>
      
      <!-- Head -->
      <circle cx="0" cy="-42" r="18" fill="#e0cfc4" opacity="0.92"/>
      
      <!-- Hair (long, dark, braided) -->
      <!-- Left braid -->
      <path d="M -14 -42 Q -20 -25 -18 10" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95"/>
      <path d="M -12 -42 Q -22 -20 -20 15" stroke="#0f0f1e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Right braid -->
      <path d="M 14 -42 Q 20 -25 18 10" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95"/>
      <path d="M 12 -42 Q 22 -20 20 15" stroke="#0f0f1e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Center hair fall -->
      <path d="M -2 -58 L 0 15" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.95"/>
      <path d="M 2 -58 L 0 15" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.95"/>
      
      <!-- Face -->
      <!-- Eyes (deadpan stare) -->
      <circle cx="-6" cy="-46" r="2.5" fill="#1a1a2e" opacity="1"/>
      <circle cx="6" cy="-46" r="2.5" fill="#1a1a2e" opacity="1"/>
      <!-- Eye pupils -->
      <circle cx="-5.5" cy="-46" r="1.2" fill="#4a3f5e" opacity="0.8"/>
      <circle cx="6.5" cy="-46" r="1.2" fill="#4a3f5e" opacity="0.8"/>
      
      <!-- Mouth (thin, unimpressed line) -->
      <line x1="-5" y1="-38" x2="5" y2="-38" stroke="#8a6a7e" stroke-width="1" opacity="0.8"/>
      
      <!-- Thought bubble (pulsing) -->
      <g id="thought" opacity="0.5">
        <ellipse cx="-38" cy="-60" rx="18" ry="12" fill="none" stroke="#7a5a7f" stroke-width="1.2" opacity="0.7"/>
        <circle cx="-28" cy="-48" r="2" fill="none" stroke="#7a5a7f" stroke-width="1" opacity="0.6"/>
        <circle cx="-48" cy="-68" r="2.5" fill="none" stroke="#7a5a7f" stroke-width="1" opacity="0.5"/>
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite" />
      </g>
      
      <!-- Slight sway -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="110,200; 113,203; 110,200; 107,203; 110,200"
        dur="4.5s"
        repeatCount="indefinite"
      />
    </g>
  </g>
  
  <!-- Thing (small animated hand, bottom center) -->
  <g id="thing">
    <g transform="translate(600, 360)">
      <!-- Palm -->
      <ellipse cx="0" cy="0" rx="12" ry="16" fill="#e0cfc4" opacity="0.85"/>
      <!-- Fingers (animated tapping) -->
      <rect x="-10" y="-20" width="4" height="12" rx="2" fill="#e0cfc4" opacity="0.85">
        <animate attributeName="y" values="-20;-18;-20" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="-4" y="-22" width="4" height="14" rx="2" fill="#e0cfc4" opacity="0.85">
        <animate attributeName="y" values="-22;-20;-22" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="2" y="-21" width="4" height="13" rx="2" fill="#e0cfc4" opacity="0.85">
        <animate attributeName="y" values="-21;-19;-21" dur="1.6s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="-19" width="4" height="11" rx="2" fill="#e0cfc4" opacity="0.85">
        <animate attributeName="y" values="-19;-17;-19" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <!-- Walking animation -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="600,360; 620,358; 640,360; 600,360"
        dur="6s"
        repeatCount="indefinite"
      />
    </g>
  </g>
  
  <!-- Decorative separators -->
  <line x1="100" y1="415" x2="1100" y2="415" stroke="#7a5a7f" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="415" r="3" fill="#c9a86b" opacity="0.6"/>
  
  <!-- Main title -->
  <text x="600" y="165" font-size="56" font-weight="bold" fill="#e8d5c4" text-anchor="middle" font-family="Georgia, serif" letter-spacing="4">
    FATMA EL MAHDI
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="240" font-size="36" fill="#c9a86b" text-anchor="middle" font-family="Georgia, serif" letter-spacing="2">
    SOFTWARE ENGINEER
  </text>
  
  <!-- Core stack -->
  <text x="600" y="310" font-size="18" fill="#b8a8b8" text-anchor="middle" font-family="monospace" letter-spacing="1">
    JAVA • SPRING BOOT • BACKEND
  </text>
  
  <!-- Focus areas -->
  <text x="600" y="345" font-size="14" fill="#9a8a9a" text-anchor="middle" font-family="monospace">
    REST APIs • JPA • Hibernate • Oracle
  </text>
</svg>